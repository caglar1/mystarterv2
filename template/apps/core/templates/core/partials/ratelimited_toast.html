{% load lucide %}
<div role="alert" class="alert alert-warning alert-soft max-w-sm shadow-lg" x-data="toast" x-show="visible" x-transition.opacity>
  {% lucide "timer" size=20 %}
  <span class="text-sm">Çok fazla istek gönderdiniz. Lütfen biraz sonra tekrar deneyin.</span>
  <button type="button" class="btn btn-circle btn-ghost btn-xs" @click="close" aria-label="Kapat">{% lucide "x" size=14 %}</button>
</div>
