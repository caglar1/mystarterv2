{% load i18n lucide %}
<li data-card-id="{{ card.pk }}" data-move-url="{% url 'kanban:card_move' card.pk %}"
    class="card card-border cursor-grab bg-base-100 shadow-xs active:cursor-grabbing">
  <div class="card-body flex-row items-start justify-between gap-2 p-3">
    <span class="text-sm font-medium">{{ card.title }}</span>
    <button type="button" class="btn btn-square btn-ghost btn-xs" aria-label="{% translate 'Delete card' %}"
            hx-post="{% url 'kanban:card_delete' card.pk %}" hx-target="closest li" hx-swap="outerHTML"
            hx-confirm="{% translate 'Delete this card?' %}">{% lucide "x" size=14 %}</button>
  </div>
</li>
