{% extends "accounts/auth_base.html" %}
{% block title %}Giriş yap · {{ project.name }}{% endblock %}
{% block heading %}Giriş yap{% endblock %}
{% block body %}
<form method="post" class="grid gap-4">
  {% csrf_token %}
  {{ form }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn btn-primary">Giriş yap</button>
</form>
<a class="link link-hover text-sm" href="{% url 'accounts:password_reset' %}">Şifremi unuttum</a>
{% endblock %}
