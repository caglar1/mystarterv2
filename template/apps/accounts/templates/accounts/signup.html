{% extends "accounts/auth_base.html" %}
{% load i18n %}
{% block title %}{% translate "Sign up" %} · {{ project.name }}{% endblock %}
{% block heading %}{% translate "Create an account" %}{% endblock %}
{% block body %}
<form method="post" class="grid gap-4">
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn btn-primary">{% translate "Sign up" %}</button>
</form>
{% endblock %}
