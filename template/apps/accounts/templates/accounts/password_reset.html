{% extends "accounts/auth_base.html" %}
{% block title %}Şifre sıfırlama · {{ project.name }}{% endblock %}
{% block heading %}Şifre sıfırlama{% endblock %}
{% block body %}
<p class="text-sm text-base-content/70">Hesabınıza kayıtlı e-posta adresini yazın; sıfırlama bağlantısı gönderelim.</p>
<form method="post" class="grid gap-4">
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn btn-primary">Bağlantı gönder</button>
</form>
{% endblock %}
