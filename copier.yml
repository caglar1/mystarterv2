# Starterpack v2 — Copier şablonu
# Kullanım: uvx copier copy --trust <bu-repo> <hedef-klasör>
# Güncelleme (üretilmiş projede): uvx copier update --trust

_min_copier_version: "9.6"  # _copier_operation (git init yalnızca ilk kurulumda)
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Django şablonları {% %} kullandığı için Copier/Jinja ayraçlarını değiştiriyoruz.
# Zaten yalnızca .jinja uzantılı dosyalar işleniyor; bu ikinci bir güvenlik katmanı.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true

_exclude:
  - "[% if not use_maps %]apps/places[% endif %]"
  - "[% if not use_llm %]apps/ai[% endif %]"
  - "[% if not use_news %]apps/news[% endif %]"
  - "[% if not use_kanban %]apps/kanban[% endif %]"
  - "[% if not use_ui_kit %]apps/pages/templates/pages/ui_kit.html[% endif %]"
  - "[% if not use_sentry %]apps/core/observability.py[% endif %]"
  - "[% if not use_sentry %]apps/core/tests/test_observability.py[% endif %]"
  - "__pycache__"
  - "*.py[co]"
  - ".DS_Store"
  - ".venv"
  - ".bin"
  - "staticfiles"
  - "static/css/app.css"
  - "db.sqlite3*"
  - ".env"
  - ".pytest_cache"
  - ".ruff_cache"

project_name:
  type: str
  help: Projenin görünen adı
  default: Benim Uygulamam

project_slug:
  type: str
  help: Python paket / klasör adı (küçük harf, alt çizgi)
  default: "[[ project_name | replace('İ', 'i') | lower | replace('ı', 'i') | replace('ş', 's') | replace('ğ', 'g') | replace('ü', 'u') | replace('ö', 'o') | replace('ç', 'c') | replace(' ', '_') | replace('-', '_') ]]"
  validator: "[% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %]Sadece küçük harf, rakam ve alt çizgi; harfle başlamalı.[% endif %]"

project_description:
  type: str
  help: >-
    Kısa açıklama (meta description ve README). Varsayılan metnin Türkçe çevirisi hazır gelir;
    değiştirirseniz çevirisini locale/tr/LC_MESSAGES/django.po'ya ekleyin.
  default: A fast, lightweight business app built with Django, htmx and Alpine.js.

author_email:
  type: str
  help: >-
    Bildirim e-postaları ve dış API'lere (Overpass, RSS) gönderilen User-Agent iletişim adresi.
    Gerçek bir adres olmalı: OpenStreetMap sunucuları example.com gibi adresleri reddeder.
  default: dev@example.com

domain:
  type: str
  help: Canlı ortam alan adı (ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, Caddyfile)
  default: example.com

languages:
  type: str
  help: >-
    Arayüz dilleri, virgülle. İlk dil kök adreste (/about/), diğerleri önekli (/tr/hakkimizda/).
    Kaynak metinler İngilizce; Türkçe çeviri hazır gelir, diğer diller için `make messages` + çeviri.
  default: en,tr
  validator: "[% if not (languages | regex_search('^[a-z]{2}(-[a-z]{2,4})?(,[a-z]{2}(-[a-z]{2,4})?)*$')) %]Örn: en,tr veya tr,en (küçük harf ISO kodları, virgülle).[% endif %]"

database:
  type: str
  help: Canlı ortam veritabanı (geliştirmede SQLite her zaman çalışır)
  choices:
    PostgreSQL (önerilen): postgres
    SQLite (tek sunucu, küçük trafik): sqlite
  default: postgres

use_maps:
  type: bool
  help: "Harita modülü: Leaflet + Overpass ile yer senkronizasyonu + yakınımdakiler"
  default: true

map_tiles:
  type: str
  when: "[[ use_maps ]]"
  help: Varsayılan harita katmanı sağlayıcısı (sonradan MAP_TILES ile değiştirilebilir)
  choices:
    "Stadia Maps (localhost'ta anahtarsız; canlıda alan adı kaydı, ticari kullanımda ücretli plan)": stadia
    "CARTO Positron (ücretsiz API anahtarı gerekir; ayda 5M karo)": carto
    "PMTiles (kendi dosyanız, ör. Cloudflare R2 — ölçekte en ucuz)": pmtiles
  default: stadia

use_llm:
  type: bool
  help: "LLM gateway: Anthropic + OpenAI uyumlu sağlayıcılar, streaming demo sayfası"
  default: true

llm_provider:
  type: str
  when: "[[ use_llm ]]"
  choices:
    "Anthropic (Claude)": anthropic
    "OpenAI uyumlu (OpenRouter, DeepSeek, Groq, Gemini, Ollama...)": openai
  default: anthropic

use_news:
  type: bool
  help: "Haber modülü: RSS -> makale çıkarma -> AI zenginleştirme -> arama (LLM modülü gerekir)"
  default: false
  validator: "[% if use_news and not use_llm %]Haber modülü LLM modülünü gerektirir (use_llm=true).[% endif %]"

use_kanban:
  type: bool
  help: "Kanban modülü: SortableJS ile sürükle-bırak, sıralama veritabanına kaydedilir"
  default: true

use_ui_kit:
  type: bool
  help: "/dev/ui-kit/ bileşen vitrini (yalnızca DEBUG modunda açılır)"
  default: true

use_sentry:
  type: bool
  help: >-
    Hata izleme (Sentry). SENTRY_DSN verilmedikçe hiçbir şey başlatılmaz ve dışarıya veri gitmez;
    açıkken kullanıcı bilgisi ve form içerikleri gönderilmez. Kapalıyken 500 hataları yalnızca
    ADMINS adreslerine e-postayla bildirilir.
  default: true

# .env dosyasını rastgele SECRET_KEY ile oluşturur; uv kuruluysa uv.lock üretir.
# İlk kurulumda git deposu açılır ve ilk commit atılır (`copier update` yalnızca git'teki projelerde çalışır).
# `update` sırasında atlanır: Copier eski/yeni sürümleri geçici klasörlerde kendi git'iyle karşılaştırır.
_tasks:
  - "[[ _copier_python ]] scripts/bootstrap_env.py"
  - command: "[[ _copier_python ]] scripts/bootstrap_env.py --git"
    when: "[[ _copier_operation == 'copy' ]]"

_message_after_copy: |
  [[ project_name ]] hazır.
  [% set missing = languages.split(',') | reject('in', ['en', 'tr']) | list %][% if missing %]
  NOT: [[ missing | join(', ') ]] için hazır çeviri yok (kaynak İngilizce, Türkçe hazır geliyor).
  Çeviri dosyalarını üretmek için: make messages (GNU gettext gerekir), sonra .po dosyalarını doldurun.
  [% endif %]  [% if 'example.com' in author_email %]
  UYARI: author_email hâlâ [[ author_email ]]. .env içinde NOTIFICATION_EMAILS ve
  (harita/haber modülleri için) OVERPASS_USER_AGENT / NEWS_USER_AGENT değerlerini gerçek adresle güncelleyin.
  [% endif %]
    cd [[ _copier_conf.dst_path ]]
    make setup     # bağımlılıklar, Tailwind CLI, vendor doğrulama, migrate, demo veri
    make dev       # runserver + tailwind --watch + görev worker'ı

  Sonraki adımlar: README.md içindeki "İlk 30 dakika" listesi.

  Yapay zeka ajanları için: AGENTS.md
